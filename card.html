<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>一封来信</title><link rel="stylesheet" href="assets/css/card.css"></head><body><div class="stars"></div><section class="loading" id="loading">正在拆开这封信…</section><section class="unavailable hidden" id="unavailable"><h1>这封信暂时无法打开</h1><p id="unavailableText">请确认链接是否完整，或稍后再试。</p></section><main class="letter-app hidden" id="app"><section class="opening" id="opening"><div><p>FOR <span id="openingRecipient"></span></p><div class="envelope" id="envelope" tabindex="0" role="button"><div class="peek"><small>TO <span id="peekRecipient"></span></small><b id="peekTitle"></b></div><div class="envelope-back"></div><div class="envelope-flap"></div><div class="seal">✦</div></div><p class="hint">轻触信封，打开惊喜</p></div></section><article class="paper" id="paper"><div class="stamp">✦<small>FOR YOU</small></div><p class="date" id="dateLine"></p><h1 id="salutation"></h1><p class="lead" id="lead"></p><div class="line"></div><section class="letter" id="letter"></section><p class="signature">—— <span id="sender"></span></p><figure class="photo-card hidden" id="photoCard"><img id="photo" alt="珍贵的回忆"><figcaption id="caption"></figcaption></figure><section class="wish"><p id="wishText"></p><button id="wishButton" type="button">↻</button></section><button class="music-toggle hidden" id="musicToggle" type="button">♫ 播放背景音乐</button></article></main><section class="locked hidden" id="locked"><h1>这封信还在路上</h1><p>请在约定时间后再打开。</p><strong id="countdown"></strong></section><div class="confetti" id="confetti"></div><script src="assets/js/supabase-config.js"></script><script src="assets/js/card.js"></script></body></html>
