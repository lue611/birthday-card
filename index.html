<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎂 生日贺卡</title>
    <style>
        /* ===== 全局重置 & 字体 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1e30 100%);
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ===== 卡片主容器 ===== */
        .card {
            position: relative;
            width: 100%;
            max-width: 500px;
            background: linear-gradient(160deg, #fdf6e3, #fef9ef);
            border-radius: 48px 48px 32px 32px;
            padding: 30px 25px 40px;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 0 2px rgba(255, 215, 100, 0.15) inset,
                0 0 40px rgba(255, 200, 50, 0.08);
            transition: transform 0.3s ease;
            text-align: center;
            overflow: hidden;
            z-index: 1;
        }

        .card::before {
            content: '';
            position: absolute;
            top: -60%;
            left: -60%;
            width: 220%;
            height: 220%;
            background: radial-gradient(circle at 30% 20%, rgba(255, 215, 100, 0.04), transparent 60%);
            pointer-events: none;
            animation: shimmer 8s infinite alternate ease-in-out;
        }

        @keyframes shimmer {
            0% {
                transform: translate(-5%, -5%) rotate(0deg);
            }
            100% {
                transform: translate(5%, 5%) rotate(6deg);
            }
        }

        /* ===== 顶部装饰光晕 ===== */
        .glow-ring {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(255, 200, 80, 0.20) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(20px);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.4;
                transform: translateX(-50%) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1.2);
            }
        }

        /* ===== 蛋糕区域 ===== */
        .cake-wrapper {
            position: relative;
            margin: 20px auto 10px;
            width: 140px;
            height: 160px;
            z-index: 2;
        }

        /* 蛋糕主体 */
        .cake {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 80px;
            background: linear-gradient(180deg, #f7b28c, #e8926e);
            border-radius: 12px 12px 20px 20px;
            box-shadow: 0 8px 0 #c47a5a, 0 12px 20px rgba(0, 0, 0, 0.2);
            z-index: 2;
        }

        /* 奶油层 1 */
        .cake .cream1 {
            position: absolute;
            top: -14px;
            left: -8px;
            right: -8px;
            height: 18px;
            background: linear-gradient(90deg, #ffdbb5, #ffefd0, #ffdbb5);
            border-radius: 40px 40px 8px 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        /* 奶油层 2 */
        .cake .cream2 {
            position: absolute;
            bottom: 28px;
            left: -6px;
            right: -6px;
            height: 14px;
            background: linear-gradient(90deg, #ffdbb5, #ffefd0, #ffdbb5);
            border-radius: 40px 40px 6px 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
        }

        /* 装饰彩条 */
        .cake .sprinkles {
            position: absolute;
            top: 30px;
            left: 12px;
            right: 12px;
            height: 4px;
            display: flex;
            justify-content: space-between;
            gap: 6px;
            flex-wrap: wrap;
            z-index: 3;
        }

        .sprinkles span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        /* ===== 蜡烛 ===== */
        .candle {
            position: absolute;
            bottom: 74px;
            left: 50%;
            transform: translateX(-50%);
            width: 14px;
            height: 36px;
            background: linear-gradient(180deg, #f7d44a, #f0b830);
            border-radius: 6px 6px 4px 4px;
            box-shadow: 0 4px 0 #b8862c, 0 6px 12px rgba(0, 0, 0, 0.15);
            z-index: 5;
            transform-origin: bottom center;
            animation: candleSway 2s infinite alternate ease-in-out;
        }

        @keyframes candleSway {
            0% {
                transform: translateX(-50%) rotate(-1.5deg);
            }
            100% {
                transform: translateX(-50%) rotate(1.5deg);
            }
        }

        /* 烛芯 */
        .candle .wick {
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 8px;
            background: #5a3e1a;
            border-radius: 2px;
        }

        /* ===== 火焰 ===== */
        .flame {
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 28px;
            background: radial-gradient(ellipse at 40% 30%, #fff7b0, #ffb347 50%, #ff6b35 90%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            filter: blur(1px);
            box-shadow: 0 0 30px rgba(255, 160, 30, 0.7), 0 0 60px rgba(255, 100, 0, 0.3);
            animation: flicker 0.15s infinite alternate ease-in-out;
            transform-origin: bottom center;
            z-index: 6;
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1, 1) rotate(-2deg);
                box-shadow: 0 0 30px rgba(255, 160, 30, 0.8), 0 0 60px rgba(255, 80, 0, 0.4);
            }
            50% {
                transform: translateX(-50%) scale(0.95, 1.08) rotate(3deg);
                box-shadow: 0 0 40px rgba(255, 180, 50, 0.9), 0 0 80px rgba(255, 100, 0, 0.5);
            }
            100% {
                transform: translateX(-50%) scale(1.05, 0.92) rotate(-1deg);
                box-shadow: 0 0 25px rgba(255, 140, 20, 0.7), 0 0 50px rgba(255, 60, 0, 0.3);
            }
        }

        /* 火焰光晕 */
        .flame-glow {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(255, 180, 50, 0.25), transparent 70%);
            border-radius: 50%;
            filter: blur(20px);
            z-index: 4;
            animation: glowPulse 1.2s infinite alternate;
        }

        @keyframes glowPulse {
            0% {
                opacity: 0.5;
                transform: translateX(-50%) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) scale(1.3);
            }
        }

        /* ===== 气球 ===== */
        .balloons {
            position: absolute;
            top: -30px;
            left: 0;
            right: 0;
            height: 100px;
            pointer-events: none;
            z-index: 0;
        }

        .balloon {
            position: absolute;
            width: 40px;
            height: 48px;
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            opacity: 0.8;
            animation: floatBalloon 6s infinite alternate ease-in-out;
        }

        .balloon::after {
            content: '';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            width: 2px;
            height: 18px;
            background: rgba(255, 255, 255, 0.2);
        }

        .balloon:nth-child(1) {
            left: 8%;
            top: 10px;
            background: radial-gradient(circle at 35% 30%, #ff8a8a, #d94f4f);
            animation-delay: 0s;
            transform: scale(0.9);
        }

        .balloon:nth-child(2) {
            left: 22%;
            top: 25px;
            background: radial-gradient(circle at 35% 30%, #8ac4ff, #4a8fd4);
            animation-delay: 1.2s;
            transform: scale(0.7);
        }

        .balloon:nth-child(3) {
            right: 22%;
            top: 20px;
            background: radial-gradient(circle at 35% 30%, #b08aff, #7a4ad4);
            animation-delay: 2.4s;
            transform: scale(0.8);
        }

        .balloon:nth-child(4) {
            right: 6%;
            top: 5px;
            background: radial-gradient(circle at 35% 30%, #ffb07a, #d47a4a);
            animation-delay: 0.6s;
            transform: scale(0.85);
        }

        @keyframes floatBalloon {
            0% {
                transform: translateY(0px) rotate(-3deg);
            }
            100% {
                transform: translateY(-18px) rotate(3deg);
            }
        }

        /* ===== 标题 & 祝福语 ===== */
        .greeting {
            position: relative;
            z-index: 5;
            margin-top: 10px;
        }

        .greeting h1 {
            font-size: 2.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #f7b731, #f5a623, #f7b731);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
            text-shadow: 0 2px 20px rgba(245, 166, 35, 0.2);
            animation: gradientShift 3s infinite alternate;
            margin-bottom: 4px;
        }

        @keyframes gradientShift {
            0% {
                background-position: 0% 50%;
            }
            100% {
                background-position: 100% 50%;
            }
        }

        .greeting .sub {
            font-size: 1.05rem;
            color: #7a6a5a;
            letter-spacing: 4px;
            font-weight: 300;
            margin-bottom: 6px;
        }

        .greeting .name {
            font-size: 1.8rem;
            font-weight: 700;
            color: #3d2c1b;
            margin: 6px 0 10px;
            background: linear-gradient(135deg, #5a3e1a, #8b6b3a);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: 2px;
        }

        /* ===== 祝福消息 ===== */
        .message-box {
            position: relative;
            z-index: 5;
            background: rgba(255, 248, 235, 0.6);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 28px;
            padding: 16px 20px;
            margin: 12px 0 20px;
            border: 1px solid rgba(255, 215, 100, 0.2);
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
        }

        .message-box p {
            font-size: 1.05rem;
            color: #3d2c1b;
            line-height: 1.6;
            font-weight: 400;
            transition: opacity 0.5s ease;
        }

        .message-box .emoji-big {
            font-size: 1.8rem;
            margin-right: 8px;
            display: inline-block;
            animation: popEmoji 2s infinite alternate;
        }

        @keyframes popEmoji {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.15);
            }
        }

        /* ===== 按钮 ===== */
        .btn-group {
            position: relative;
            z-index: 5;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }

        .btn {
            background: linear-gradient(145deg, #f7b731, #e8a020);
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            color: #1e1a14;
            cursor: pointer;
            box-shadow: 0 6px 0 #b87a1a, 0 10px 24px rgba(247, 183, 49, 0.3);
            transition: all 0.12s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
            flex: 0 1 auto;
        }

        .btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #b87a1a, 0 8px 20px rgba(247, 183, 49, 0.25);
        }

        .btn-secondary {
            background: linear-gradient(145deg, #a8b4c8, #8f9bb0);
            box-shadow: 0 6px 0 #6a7488, 0 10px 24px rgba(143, 155, 176, 0.25);
        }

        .btn-secondary:active {
            box-shadow: 0 1px 0 #6a7488, 0 8px 20px rgba(143, 155, 176, 0.2);
        }

        .btn .icon {
            font-size: 1.2rem;
        }

        /* ===== 五彩纸屑容器 ===== */
        .confetti-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
            overflow: hidden;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            0% {
                opacity: 1;
                transform: translateY(-20px) rotate(0deg) scale(0.8);
            }
            100% {
                opacity: 0;
                transform: translateY(110vh) rotate(720deg) scale(1.2);
            }
        }

        /* ===== 星星闪烁 ===== */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
            border-radius: inherit;
        }

        .star {
            position: absolute;
            width: 4px;
            height: 4px;
            background: #fff9e6;
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 215, 100, 0.5);
            animation: twinkle 2.5s infinite alternate;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.15;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        /* ===== 底部签名 ===== */
        .footer {
            position: relative;
            z-index: 5;
            margin-top: 24px;
            font-size: 0.75rem;
            color: #b09a82;
            letter-spacing: 1px;
            border-top: 1px solid rgba(200, 180, 160, 0.2);
            padding-top: 16px;
        }

        .footer span {
            color: #e8926e;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 480px) {
            .card {
                padding: 20px 16px 30px;
                border-radius: 32px;
            }

            .greeting h1 {
                font-size: 2rem;
            }
            .greeting .name {
                font-size: 1.4rem;
            }
            .cake-wrapper {
                width: 120px;
                height: 140px;
            }
            .cake {
                width: 100px;
                height: 68px;
            }
            .candle {
                height: 30px;
                bottom: 62px;
            }
            .flame {
                width: 16px;
                height: 22px;
                top: -18px;
            }
            .btn {
                padding: 12px 22px;
                font-size: 0.9rem;
                flex: 1 1 100%;
            }
            .balloon {
                transform: scale(0.7);
            }
            .balloon:nth-child(1) {
                left: 2%;
            }
            .balloon:nth-child(4) {
                right: 2%;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 卡片 ===== -->
    <div class="card" id="card">

        <!-- 星星 -->
        <div class="stars" id="starsContainer"></div>

        <!-- 光晕 -->
        <div class="glow-ring"></div>

        <!-- 气球 -->
        <div class="balloons">
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
            <div class="balloon"></div>
        </div>

        <!-- ===== 蛋糕 ===== -->
        <div class="cake-wrapper">
            <div class="cake">
                <div class="cream1"></div>
                <div class="cream2"></div>
                <div class="sprinkles">
                    <span style="background:#ff6b6b;"></span>
                    <span style="background:#feca57;"></span>
                    <span style="background:#48dbfb;"></span>
                    <span style="background:#ff9ff3;"></span>
                    <span style="background:#54a0ff;"></span>
                    <span style="background:#ff9f43;"></span>
                    <span style="background:#1dd1a1;"></span>
                    <span style="background:#ee5a24;"></span>
                    <span style="background:#a29bfe;"></span>
                    <span style="background:#fd79a8;"></span>
                </div>
            </div>
            <!-- 蜡烛 + 火焰 -->
            <div class="candle" id="candle">
                <div class="wick"></div>
                <div class="flame" id="flame"></div>
                <div class="flame-glow" id="flameGlow"></div>
            </div>
        </div>

        <!-- ===== 文字内容 ===== -->
        <div class="greeting">
            <div class="sub">🎈 生日快乐 🎈</div>
            <h1>HAPPY BIRTHDAY</h1>
            <div class="name" id="nameDisplay">🎂 亲爱的朋友</div>
        </div>

        <!-- ===== 祝福消息 ===== -->
        <div class="message-box" id="messageBox">
            <p id="messageText">
                <span class="emoji-big">✨</span>
                愿你的每一天都闪闪发光，每一岁都更美更好！
            </p>
        </div>

        <!-- ===== 按钮 ===== -->
        <div class="btn-group">
            <button class="btn" id="btnBless">
                <span class="icon">🎁</span> 点我收祝福
            </button>
            <button class="btn btn-secondary" id="btnConfetti">
                <span class="icon">🎊</span> 撒花
            </button>
        </div>

        <!-- 底部 -->
        <div class="footer">
            ✦ 送给你 · 最特别的一天 ✦ <span>♥</span>
        </div>
    </div>

    <!-- ===== 五彩纸屑容器 ===== -->
    <div class="confetti-container" id="confettiContainer"></div>

    <!-- ===== JavaScript ===== -->
    <script>
        (function() {
            'use strict';

            // ---------- DOM 引用 ----------
            const nameDisplay = document.getElementById('nameDisplay');
            const messageText = document.getElementById('messageText');
            const messageBox = document.getElementById('messageBox');
            const btnBless = document.getElementById('btnBless');
            const btnConfetti = document.getElementById('btnConfetti');
            const confettiContainer = document.getElementById('confettiContainer');

            // ---------- 祝福语库 ----------
            const messages = [
                { emoji: '🌟', text: '愿你所求皆如愿，所行皆坦途，生日快乐！' },
                { emoji: '🌈', text: '愿你的世界永远五彩斑斓，笑容永远灿烂如光。' },
                { emoji: '🎂', text: '新的一岁，愿你被时光温柔以待，活成自己喜欢的样子。' },
                { emoji: '🌺', text: '愿所有的美好，都在今天如约而至。生日快乐！' },
                { emoji: '🎈', text: '愿你的梦想像气球一样，飞得高远，触手可及。' },
                { emoji: '💎', text: '你是这世上独一无二的存在，珍贵且闪耀。' },
                { emoji: '🦋', text: '愿生命中的每一次蜕变，都让你更自由、更美丽。' },
                { emoji: '🌻', text: '愿阳光永远照亮你的前路，心中有暖，眼中有光。' },
            ];

            // ---------- 随机祝福 ----------
            function setRandomMessage() {
                const idx = Math.floor(Math.random() * messages.length);
                const msg = messages[idx];
                messageText.innerHTML = `<span class="emoji-big">${msg.emoji}</span> ${msg.text}`;
                // 小弹跳动画
                messageBox.style.transition = 'transform 0.2s ease';
                messageBox.style.transform = 'scale(0.96)';
                setTimeout(() => {
                    messageBox.style.transform = 'scale(1)';
                }, 100);
            }

            // ---------- 修改名字（点击名字可编辑） ----------
            nameDisplay.addEventListener('dblclick', function() {
                const current = this.textContent.replace('🎂 ', '').trim();
                const newName = prompt('🎈 输入寿星的名字：', current);
                if (newName !== null && newName.trim() !== '') {
                    this.textContent = '🎂 ' + newName.trim();
                }
            });

            // ---------- 祝福按钮 ----------
            btnBless.addEventListener('click', function() {
                setRandomMessage();
                // 同时触发小庆祝动画：蜡烛闪一下
                const flame = document.getElementById('flame');
                const glow = document.getElementById('flameGlow');
                flame.style.animation = 'none';
                glow.style.animation = 'none';
                setTimeout(() => {
                    flame.style.animation = 'flicker 0.15s infinite alternate ease-in-out';
                    glow.style.animation = 'glowPulse 1.2s infinite alternate';
                }, 20);
                // 按钮反馈
                this.style.transform = 'scale(0.94)';
                setTimeout(() => { this.style.transform = ''; }, 120);
            });

            // ---------- 五彩纸屑 ----------
            function fireConfetti(count = 80) {
                const colors = [
                    '#ff6b6b', '#feca57', '#48dbfb', '#ff9ff3',
                    '#54a0ff', '#ff9f43', '#1dd1a1', '#ee5a24',
                    '#a29bfe', '#fd79a8', '#ffd93d', '#6bcb77',
                    '#4d96ff', '#ff6b6b', '#f9ca24', '#f368e0'
                ];

                const fragment = document.createDocumentFragment();

                for (let i = 0; i < count; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    const color = colors[Math.floor(Math.random() * colors.length)];
                    const left = Math.random() * 100;
                    const size = 6 + Math.random() * 10;
                    const duration = 2.2 + Math.random() * 1.8;
                    const delay = Math.random() * 0.6;
                    const rotate = Math.random() * 360;
                    const shapes = ['50%', '0'];
                    const borderRadius = shapes[Math.floor(Math.random() * shapes.length)];

                    piece.style.left = left + '%';
                    piece.style.width = size + 'px';
                    piece.style.height = (size * (0.6 + Math.random() * 0.8)) + 'px';
                    piece.style.background = color;
                    piece.style.borderRadius = borderRadius;
                    piece.style.animationDuration = duration + 's';
                    piece.style.animationDelay = delay + 's';
                    piece.style.transform = `rotate(${rotate}deg)`;
                    piece.style.boxShadow = `0 0 6px ${color}40`;

                    fragment.appendChild(piece);
                }

                confettiContainer.appendChild(fragment);

                // 自动清理
                setTimeout(() => {
                    confettiContainer.innerHTML = '';
                }, 4500);
            }

            btnConfetti.addEventListener('click', function() {
                fireConfetti(100);
                // 按钮反馈
                this.style.transform = 'scale(0.94)';
                setTimeout(() => { this.style.transform = ''; }, 120);
                // 顺便改一条祝福
                setRandomMessage();
            });

            // ---------- 生成背景星星 ----------
            function createStars() {
                const container = document.getElementById('starsContainer');
                const count = 40;
                const fragment = document.createDocumentFragment();
                for (let i = 0; i < count; i++) {
                    const star = document.createElement('div');
                    star.className = 'star';
                    const x = Math.random() * 100;
                    const y = Math.random() * 100;
                    const size = 2 + Math.random() * 4;
                    const delay = Math.random() * 3;
                    const duration = 1.8 + Math.random() * 2.2;
                    star.style.left = x + '%';
                    star.style.top = y + '%';
                    star.style.width = size + 'px';
                    star.style.height = size + 'px';
                    star.style.animationDelay = delay + 's';
                    star.style.animationDuration = duration + 's';
                    fragment.appendChild(star);
                }
                container.appendChild(fragment);
            }
            createStars();

            // ---------- 初始显示一条随机祝福 ----------
            setRandomMessage();

            // ---------- 双击卡片任意位置也可触发撒花（小彩蛋） ----------
            document.getElementById('card').addEventListener('dblclick', function(e) {
                // 避免双击名字时同时触发
                if (e.target.closest('.greeting') && e.target.closest('.name')) return;
                fireConfetti(50);
                setRandomMessage();
            });

            // ---------- 控制台小提示 ----------
            console.log('🎂 生日快乐！双击卡片任意空白处可以撒花哦～');
            console.log('💡 双击名字可以修改寿星名称！');

        })();
    </script>

</body>
</html>
