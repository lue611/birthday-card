<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>一封生日来信</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="constellation"></div>
  <section class="opening" id="opening">
    <div>
      <header class="opening-copy"><p>FOR <span id="openingRecipient"></span></p><h1>一封生日来信</h1></header>
      <div class="envelope-stage" id="envelope" role="button" tabindex="0" aria-label="打开生日信封">
        <div class="envelope"><div class="envelope-back"></div><div class="letter-peek"><p>TO <span id="peekRecipient"></span></p><strong id="peekWord">生日快乐</strong></div><div class="envelope-flap"></div><div class="seal"><span>✦</span></div></div>
      </div>
      <p class="open-hint">轻触信封，打开惊喜</p>
    </div>
  </section>

  <main class="memory" id="memory">
    <article class="paper">
      <div class="stamp">✦<small>GOOD DAY</small></div>
      <p class="date" id="dateLine"></p>
      <h1 class="salutation" id="salutation"></h1>
      <p class="lead" id="lead"></p>
      <div class="divider"></div>
      <section class="letter" id="letter"></section>
      <div class="signature">—— <span id="sender"></span></div>
      <figure class="memory-card hidden" id="photoCard"><img id="photo" alt="生日回忆照片"><figcaption id="caption"></figcaption></figure>
      <section class="message-wheel"><p id="wish" aria-live="polite"></p><button type="button" id="wishButton" aria-label="换一句祝福">↻</button></section>
      <button class="music-button hidden" id="musicButton" type="button">♫ 播放这封信的背景音乐</button>
      <p class="footer-line">THIS MOMENT WAS MADE JUST FOR YOU</p>
    </article>
  </main>
  <section class="countdown-layer hidden" id="countdown"><div class="countdown-box"><h2>这封信还在路上</h2><p>在约定的时刻到来之前，先把这份期待好好收藏。</p><div class="countdown-number" id="countdownNumber"></div></div></section>
  <audio id="music" preload="none" loop></audio>
  <div class="confetti" id="confetti"></div>
  <script src="config.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
