<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>制作一封专属来信｜信笺时刻</title><link rel="stylesheet" href="assets/css/product.css"></head><body class="create-page"><main class="create-shell"><a class="brand back" href="./">← 信笺时刻</a><header><p class="kicker">CREATE YOUR LETTER</p><h1>制作一封专属来信</h1><p>填写完成后会自动生成一条只属于 TA 的链接。</p></header><form id="createForm" novalidate><section><h2>1. 选择模板</h2><div class="template-picker" id="templatePicker"></div></section><section><h2>2. 写下心意</h2><label>收件人称呼<input name="recipient" required maxlength="30" placeholder="例如：妈妈、小满、李老师"></label><label>你的署名<input name="sender" required maxlength="30" placeholder="例如：永远爱你的女儿"></label><label>开场白<textarea name="openingLine" required maxlength="100" placeholder="例如：今天，世界又多了一点温柔。"></textarea></label><label>信件正文<textarea name="letter" required maxlength="1600" rows="8" placeholder="可分段书写；段落之间空一行。"></textarea></label><label>一句小祝福（可选）<input name="shortWishes" maxlength="360" placeholder="多句请用 | 分隔"></label></section><section><h2>3. 加入回忆（可选）</h2><label>一张照片<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><p class="field-note">支持 JPG、PNG、WebP，最大 5MB。</p><label>照片说明<input name="photoCaption" maxlength="80"></label><label>指定开启时间（可选）<input name="openAt" type="datetime-local"></label></section><div class="form-error" id="formError" role="alert"></div><button class="button submit" id="submitButton" type="submit">生成专属链接 <span>↗</span></button><p class="consent">提交即代表你确认拥有文字与照片的使用权；页面按随机专属 ID 隔离。</p></form></main><script src="assets/js/supabase-config.js"></script><script src="assets/js/create.js"></script></body></html>
